# inspector-gate (SPEC.md sections 2, 4, 5, 7, 8; issue #4). The cloud
# half. Small and dumb on purpose: two questions, no AI, no judgment calls.
#
# This runs on `pull_request_target`, not `pull_request`, so GitHub reads
# THIS FILE's own definition from the base branch, never from the pull
# request under test - a pull request cannot rewrite the check that judges
# it. `.github/**` is itself in the protected-path floor that
# inspector-gate.sh enforces (ALWAYS_PROTECTED), so an attempted edit to
# this file, or to inspector-gate.sh, fails question 2 of its own run,
# every time. See inspector-gate.sh's header for the full safety notes,
# including why this workflow must never add `actions/checkout`.
#
# The job below deliberately has no job-level `if`. A job an `if` skips
# reports a "skipped" conclusion, and whether GitHub treats "skipped" as
# passing for a *required* status check is a known trap, not a documented
# guarantee - so the job always runs on every pull request, and question 2
# is answered inside the one step instead. Every run reports a real pass
# or fail, never a skip.
#
# A failing (or missing) check here does not, by itself, block a merge:
# GitHub only enforces that once this job is marked a required status
# check in the repository's branch protection settings - Settings ->
# Branches -> branch protection rule for the base branch -> "Require
# status checks to pass before merging" -> add "gate". That is a manual
# repository setting this workflow cannot turn on for itself; see the
# "inspector-gate" section of README.md for the same note in context.
# The second trigger, `status`, exists for an ordering reason: a commit
# status can only be posted to a commit that is already on the remote, so
# inspector's green status lands seconds AFTER the push whose
# `synchronize` run has already, correctly, reported "no status posted at
# all". Nothing re-ran the check when the status arrived, so the red
# stood until a human re-ran it by hand. `status` fires when the status
# lands, and the gate answers both questions again.
#
# That trigger changes nothing about the trust boundary. A status event
# carries no pull request context - only a commit sha and no ref of its
# own - so this job bootstraps the script below from the repository's
# DEFAULT branch, a fixed root no pull request can write to, uses it to
# make one read-only API call asking which open pull request that commit
# heads, and then re-fetches and runs the script from that pull request's
# real BASE ref before anything decides the outcome. Still no checkout,
# still nothing from the pull request branch ever executed, still only
# API reads compared as strings.
#
# Honest limit, recorded rather than papered over: GitHub associates a
# status-triggered run with the default branch's last commit (that is its
# documented GITHUB_SHA for this event), not with the commit the status
# was posted to. So this re-check reports a real pass or fail of its own,
# but it does not overwrite the earlier `gate` check already recorded on
# the pull request's head commit. Landing it there instead would mean
# this job posting a commit status of its own, which needs a write
# permission it deliberately does not have.
name: inspector-gate

on:
  pull_request_target:
  status:

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check inspector status and protected files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # On pull_request_target, the pull request under test, straight
          # from the event payload. Empty on a status event, which knows
          # none of it - main_status_event looks it all up instead.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The pull request's own count of changed files, straight from
          # the event payload - not from a live API call, and not subject
          # to the listing cap inspector-gate.sh checks it against.
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          # On a status event, the one thing it carries: the commit a
          # status was just posted to.
          STATUS_SHA: ${{ github.event.sha }}
          # Which ref to fetch this gate's own script from. A status event
          # has no ref of its own to trust, so it bootstraps from the
          # default branch and re-fetches from the pull request's base ref
          # once that is known; pull_request_target already has the base.
          BOOTSTRAP_REF: ${{ github.event_name == 'status' && github.event.repository.default_branch || github.event.pull_request.base.sha }}
          # Must match exactly what inspector (the local half, issue #3)
          # posts as its commit status context - see SPEC.md section 7.
          STATUS_CONTEXT: inspector
        # No `actions/checkout` (see the header notes above), so nothing is
        # on disk to run a script file from. Instead this fetches
        # inspector-gate.sh's own content via the same Contents API call
        # the script itself uses for .inspector.json, and sources it -
        # never the pull request's copy. That file is itself covered by
        # ALWAYS_PROTECTED (.github/**), so a pull request cannot change
        # what gets fetched and run here.
        run: |
          set -euo pipefail
          script=$(gh api "repos/$REPO/contents/.github/scripts/inspector-gate.sh?ref=$BOOTSTRAP_REF" --jq '.content' | tr -d '\n' | base64 -d)
          source <(printf '%s' "$script")
          if [ "$EVENT_NAME" = "status" ]; then
            main_status_event
          else
            main
          fi
